  time_range_2:
    start_time: "2010-01-12 12:00:00"
    end_time: "2010-01-12 13:00:00"
  expected: []

- name: multiple_intervals
  time_range_1:
    start_time: "2010-01-12 10:00:00"
    end_time: "2010-01-12 11:00:00"
    number_of_intervals: 3
    gap_between_intervals_s: 300
  time_range_2:
    start_time: "2010-01-12 10:15:00"
    end_time: "2010-01-12 10:45:00"
    number_of_intervals: 2
    gap_between_intervals_s: 60
  expected:
