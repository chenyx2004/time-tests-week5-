- name: generic_case
  time_range_1:
    start_time: "2010-01-12 10:00:00"
    end_time: "2010-01-12 12:00:00"
  time_range_2:
    start_time: "2010-01-12 10:30:00"
    end_time: "2010-01-12 10:45:00"
    number_of_intervals: 2
    gap_between_intervals_s: 60
  expected:
    - ["2010-01-12 10:30:00", "2010-01-12 10:37:00"]
    - ["2010-01-12 10:38:00", "2010-01-12 10:45:00"]

- name: no_overlap
